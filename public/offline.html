<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#C4622D" />
    <title>Gr3tful — You’re offline</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #fff8f0;
        color: #3d2314;
        font-family: Georgia, serif;
        text-align: center;
      }
      main { max-width: 480px; }
      .mark { color: #c4622d; font-size: 44px; }
      h1 { margin: 14px 0 10px; font-size: clamp(30px, 8vw, 46px); }
      p { color: #7a4a2a; line-height: 1.7; }
      button {
        margin-top: 18px;
        border: 0;
        border-radius: 999px;
        padding: 12px 24px;
        background: #c4622d;
        color: #fff8f0;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">✦</div>
      <h1>A quiet moment offline.</h1>
      <p>Reconnect to open your private journal and save new gratitudes safely.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
